          inList = true;
        }
        result += `<li>${parseInline(listMatch[1])}</li>`;

        result += `<h${level}>${parseInline(headerMatch[2])}</h${level}>`;
        continue;
      }
      if (line.trim() === "") {
        result += '<div class="spacer"></div>';
      } else {
        result += `<p>${parseInline(line)}</p>`;
      }

    if (inCodeBlock) result += "</code></pre>";
